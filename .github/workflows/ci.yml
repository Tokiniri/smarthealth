name: CI Quality Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run Tests with coverage
        run: npm test

      - name: Debug - Lister les fichiers de couverture
        run: |
          ls -la coverage/ || echo "Dossier coverage inexistant"
          head -5 coverage/lcov.info || echo "Fichier lcov.info introuvable"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectKey=tokiniri_smarthealth
            -Dsonar.organization=tokiniri
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}